version: "3.8"

services:
  config-upstream:
    image: python:3.12-slim
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                body = b'{"status":"upstream-ok"}'
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

  config-drift-api:
    build: ./apps/config-drift-api
    ports:
      - "18081:8080"
    depends_on:
      - config-upstream

  package-regression-api:
    build: ./apps/package-regression-api
    ports:
      - "18082:8080"

  permission-drift-go-http:
    build: ./apps/permission-drift-go-http
    ports:
      - "18083:8080"

  permission-drift-node-express:
    build: ./apps/permission-drift-node-express
    ports:
      - "18085:8080"

  permission-drift-python-flask:
    build: ./apps/permission-drift-python-flask
    ports:
      - "18086:8080"

  permission-drift-php-laravel-style:
    build: ./apps/permission-drift-php-laravel-style
    ports:
      - "18087:8080"

  permission-drift-php-laravel-inferred:
    build: ./apps/permission-drift-php-laravel-inferred
    ports:
      - "18090:8080"

  permission-drift-ruby-lightweight:
    build: ./apps/permission-drift-ruby-lightweight
    ports:
      - "18088:8080"

  permission-drift-java-lightweight:
    build: ./apps/permission-drift-java-lightweight
    ports:
      - "18089:8080"

  restart-reload-api:
    build: ./apps/restart-reload-api
    ports:
      - "18084:8080"
