version: "3.8"

services:
  config-upstream:
    image: python:3.12-slim
    command:
      - python
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                body = b'{"status":"upstream-ok"}'
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

  config-drift-api:
    build: ./apps/config-drift-api
    ports:
      - "18081:8080"
    depends_on:
      - config-upstream

  package-regression-api:
    build: ./apps/package-regression-api
    ports:
      - "18082:8080"

  permission-drift-api:
    build: ./apps/permission-drift-api
    ports:
      - "18083:8080"

  restart-reload-api:
    build: ./apps/restart-reload-api
    ports:
      - "18084:8080"
